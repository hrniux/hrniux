<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">hrniu — Java/Spring backends and explainable agent systems</title>
  <desc id="desc">GitHub profile banner for hrniu, focused on Java/Spring backends and explainable agent systems.</desc>
  <defs>
    <pattern id="lattice" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#2A3B57" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="gold" x1="72" y1="196" x2="560" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6BC7B"/>
      <stop offset="1" stop-color="#C9954A"/>
    </linearGradient>
  </defs>

  <!-- 背景：纯色 + 均匀点阵 -->
  <rect width="1280" height="420" fill="#0A111C"/>
  <rect width="1280" height="420" fill="url(#lattice)"/>

  <!-- 黄金比例同心圆（右上角，半径 40·φⁿ，φ≈1.618034） -->
  <g fill="none" stroke="#E6BC7B" stroke-opacity="0.14" stroke-width="1.5">
    <circle cx="1280" cy="0" r="40"/>
    <circle cx="1280" cy="0" r="64.72"/>
    <circle cx="1280" cy="0" r="104.72"/>
    <circle cx="1280" cy="0" r="169.44"/>
    <circle cx="1280" cy="0" r="274.16"/>
  </g>

  <!-- 左侧文字块 -->
  <rect x="72" y="76" width="3" height="44" rx="1.5" fill="#E6BC7B"/>
  <text x="88" y="99" fill="#EDF2F9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="4">HRNIU</text>
  <text x="88" y="123" fill="#E6BC7B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="2.5">JAVA · SPRING · AGENT SYSTEMS</text>

  <text x="72" y="196" fill="#EDF2F9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700">Systems with</text>
  <text x="72" y="256" fill="url(#gold)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700">clarity and character.</text>
  <text x="72" y="308" fill="#8AA0BC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="500">Java/Spring backends · explainable agents · browser products</text>
  <text x="72" y="344" fill="#5F7490" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500">Clear architecture. Fast feedback. Verifiable delivery.</text>

  <!-- 右侧三张能力卡（等宽 416、等高 88、等距 12） -->
  <g>
    <rect x="800" y="64" width="416" height="88" rx="12" fill="#0F1A2B" stroke="#22344F"/>
    <g transform="translate(832 108)">
      <rect x="-7.07" y="-7.07" width="14.14" height="14.14" stroke="#E6BC7B" stroke-width="2"/>
    </g>
    <text x="856" y="102" fill="#EDF2F9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Java / Spring</text>
    <text x="856" y="126" fill="#8298B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Spring Boot · Spring AI · REST · tests</text>
  </g>

  <g>
    <rect x="800" y="164" width="416" height="88" rx="12" fill="#0F1A2B" stroke="#22344F"/>
    <g transform="translate(832 208)">
      <polygon points="0,-10 8.66,5 -8.66,5" stroke="#E6BC7B" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </g>
    <text x="856" y="202" fill="#EDF2F9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Explainable agents</text>
    <text x="856" y="226" fill="#8298B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">RAG · MCP · rules · audit trails</text>
  </g>

  <g>
    <rect x="800" y="264" width="416" height="88" rx="12" fill="#0F1A2B" stroke="#22344F"/>
    <g transform="translate(832 308)">
      <polygon points="10,0 5,8.66 -5,8.66 -10,0 -5,-8.66 5,-8.66" stroke="#E6BC7B" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </g>
    <text x="856" y="302" fill="#EDF2F9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Browser + tooling</text>
    <text x="856" y="326" fill="#8298B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Canvas games · Codex · automation</text>
  </g>
</svg>
