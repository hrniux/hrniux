<svg width="720" height="300" viewBox="0 0 720 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Browser Game Arcade</title>
  <desc id="desc">Project card for a browser-native arcade built with vanilla JavaScript and Canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="696" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1A31"/>
      <stop offset="1" stop-color="#102746"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="298" rx="19" stroke="#67B8F7" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="636" cy="64" r="116" fill="#38BDF8" fill-opacity="0.07"/>
  <text x="40" y="54" fill="#7DD3FC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">SELECTED WORK · WEB</text>
  <text x="40" y="112" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">Browser Game Arcade</text>
  <text x="40" y="151" fill="#B8C9E0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Playable mini games and interactive experiments,</text>
  <text x="40" y="176" fill="#B8C9E0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">built to open fast and run directly in the browser.</text>
  <g>
