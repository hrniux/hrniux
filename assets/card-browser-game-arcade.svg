    <text x="63" y="238" fill="#D8F3FF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">VANILLA JS</text>
    <rect x="174" y="216" width="92" height="34" rx="17" fill="#16334F"/>
    <text x="196" y="238" fill="#D8F3FF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">CANVAS</text>
    <rect x="278" y="216" width="118" height="34" rx="17" fill="#16334F"/>
    <text x="299" y="238" fill="#D8F3FF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">PLAYWRIGHT</text>
